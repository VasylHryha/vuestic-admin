name: CI/CD Workflow

on:
  push:
    branches:
      - test
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-dir: ${{ steps.build-dir.outputs.build-path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint and Build
        run: yarn build:ci

      - name: Save Build Artifacts
        id: build-dir
        run: echo "::set-output name=build-path::./dist"

  visual-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Serve Built Project
        run: |
          yarn start:ci &
          sleep 5 # Ensure the server has time to start

      - name: Run Playwright Visual Tests
        run: yarn test:visual

      - name: Run Chromatic Visual Tests
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: yarn chromatic

  e2e-tests:
    needs: [build, visual-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Reset E2E Database
        run: |
          echo "Resetting E2E database..."
          yarn reset-db # Replace with your actual database reset script

      - name: Run E2E Tests
        run: yarn test:e2e
