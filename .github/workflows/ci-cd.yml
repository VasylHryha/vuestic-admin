name: CI/CD Workflow

on:
  push:
    branches:
      - test
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint and Build
        run: yarn build:ci

  visual-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Start Server for Tests
        run: |
          yarn start:ci &
          npx wait-on http://localhost:5173 # Adjust to your server URL

      - name: Run Visual Tests
        run: yarn test:visual

      - name: Run Chromatic Visual Tests
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: yarn chromatic

  e2e-tests:
    needs: [build, visual-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Reset Database for E2E
        run: yarn reset-db

      - name: Start Server for Tests
        run: |
          yarn start:ci &
          npx wait-on http://localhost:5173 # Wait for the server to start

      - name: Run E2E Tests
        run: yarn test:e2e
