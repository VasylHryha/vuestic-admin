name: CI/CD Workflow

on:
  push:
    branches:
      - test
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint and Build
        run: yarn build:ci

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: build-output
          path: ./dist # Adjust path to your build output

      - name: Serve Build
        run: yarn start:ci


  e2e-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v3
        with:
          name: build-output

      - name: Serve Build
        run: yarn start:ci

#      - name: Reset Database
#        run: yarn reset-db

      - name: Run E2E Tests
        run: yarn test:e2e

  visual-tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v3
        with:
          name: build-output

      - name: Serve Build
        run: yarn start:ci

      - name: Run Visual Tests
        run: yarn test:visual
